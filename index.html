<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOSS INTERCOM V1.6</title><style>body{margin:0;background:#0d1727;color:white;font-family:system-ui,sans-serif}main{max-width:520px;margin:auto;padding:22px}h1{font-size:27px}h1 span{color:#fb455d}.card{background:#1b2b40;border-radius:15px;padding:17px;margin:13px 0}label{display:block;margin:9px 0}input{width:100%;box-sizing:border-box;padding:13px;background:#0d1727;color:white;border:1px solid #54708b;border-radius:9px;font-size:16px}button{padding:15px;border:0;border-radius:11px;color:white;background:#087d4b;font-size:16px;font-weight:bold;margin:5px 4px 5px 0}button.secondary{background:#38526f}button.danger{background:#a32435}small{color:#b4c3d4}#log{white-space:pre-wrap;font-size:13px;max-height:190px;overflow:auto}strong{color:#75dfaa}</style></head><body><main><h1>BOSS <span>INTERCOM</span></h1><small>V1.6 · 通信接続診断（音声未実装）</small><div class="card"><div>通信状態：<strong id="status">未接続</strong></div><div>遅延：<strong id="latency">--</strong></div><div>参加者：<strong id="count">--</strong></div></div><div class="card"><label>接続サーバー（wss://）<input id="server" placeholder="wss://your-server.example.com"></label><label>ペア番号<input id="room" value="BOSS-001" maxlength="32"></label><button id="connect">接続する</button><button id="disconnect" class="danger">切断</button><button id="ping" class="secondary">遅延を測定</button></div><div class="card"><b>通信ログ</b><div id="log"></div></div><small>これは通信確認用の試作品です。このページとWebSocketサーバーは同じURLで公開されます。PTT・Bluetooth・音声通話は未実装です。</small></main><script>document.getElementById('server').value=location.protocol==='https:'?'wss://'+location.host:'';let ws=null, timer=null, pending=new Map(),reconnect=false;const el=id=>document.getElementById(id);function log(s){el('log').textContent=new Date().toLocaleTimeString()+' '+s+'\n'+el('log').textContent}function stop(){reconnect=false;clearTimeout(timer);if(ws){ws.onclose=null;ws.close();ws=null}el('status').textContent='未接続';el('count').textContent='--'}function join(){const url=el('server').value.trim(),room=el('room').value.trim();if(!/^wss:\/\//i.test(url)){log('wss:// の接続先を入力してください');return}if(!room){log('ペア番号が必要です');return}if(ws&&ws.readyState<=1)ws.close();reconnect=true;el('status').textContent='接続中';try{ws=new WebSocket(url)}catch(e){log('URLが不正です');return}ws.onopen=()=>{el('status').textContent='接続済み';log('サーバーに接続');ws.send(JSON.stringify({type:'join',room}))};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='presence'){el('count').textContent=m.count+'台'}if(m.type==='pong'&&pending.has(m.id)){el('latency').textContent=Math.round(performance.now()-pending.get(m.id))+' ms';pending.delete(m.id)}if(m.type==='error')log('エラー: '+m.message)};ws.onclose=()=>{el('status').textContent='切断';log('通信切断');if(reconnect)timer=setTimeout(join,4000)};ws.onerror=()=>log('接続エラー（サーバー公開状況を確認）')};el('connect').onclick=join;el('disconnect').onclick=()=>{stop();log('手動切断')};el('ping').onclick=()=>{if(!ws||ws.readyState!==1){log('先に接続してください');return}const id=String(Date.now());pending.set(id,performance.now());ws.send(JSON.stringify({type:'ping',id}));setTimeout(()=>{if(pending.has(id)){pending.delete(id);log('応答なし')}},5000)};</script></body></html>
